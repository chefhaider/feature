uid: "027"
date: 2026-07-23
week: W13
stage: probing
status: success

model:
  tag: xlsr300m
  hf_id: facebook/wav2vec2-xls-r-300m
  pretraining: 128 languages
  n_layers_incl_input: 25
  hidden_size: 1024
  legacy_tag_in_early_csvs: xl500
  fine_tuned: false   # models are frozen throughout the project

dataset:
  name: google/fleurs
  split: train
  languages: [en_us, de_de, es_419]
  utterances_per_language: 100
  sampling_rate_hz: 16000

condition:
  summary: forced_alignment / all_ordered_pairs / paired k-fold gap test
  frame_to_phoneme: forced (MMS)
  pooling: mean pool over aligned phoneme span
  transfer_protocol: all 6 ordered language pairs
  features_probed: [voicing, nasal, manner, place]
  segment_filters:
    voicing: obstruents only
    nasal: all segments
    manner: consonants only
    place: consonants only

hyperparameters:
  probe: logistic_regression
  scaler: standard
  max_iter: 2000
  class_weight: balanced
  n_probe: 100
  layer_stride: 2
  n_repeats: 5
  test_size: 0.2
  n_boot: 200
  kfold: 5
  kfold_repeats: 3
  split_grouping: utterance
  ci: percentile 2.5/97.5

seeds:
  master_seed: 0
  n_independent_seeds_run: 1
  tier_a_three_seed_requirement: NOT_MET
  variance_source: |
    Single master seed. sklearn random_state=0 is fixed in probing.py for
    evaluate_probe, cross_lingual_probe and paired_gap_kfold. Spread is
    reported from repeated splits and bootstraps under that one seed, not from
    independent seeds.

compute:
  cluster: FAU HPC (NHR@FAU), $WORK/BIMAP-FEATURE
  partition: v100
  slurm_job_ids: [1758364, 1758365]
  merge_job_id: 1758365
  wall_clock_min: 347.1
  conda_env: feature

results:
  metric: macro_f1
  within_language: 0.81
  cross_lingual: 0.668
  majority_baseline: 0.301
  aggregation: |
    Mean over the four features, each taken at that feature's best layer (best
    = highest mean within-language macro-F1). Cross-lingual is the mean over
    all evaluated language pairs at the same layers.

artifacts:
  primary: results/20260723_02061011

provenance:
  confidence: confirmed
  reconstructed_on: 2026-08-06
  evidence:
    - slurm/logs/probing_worker_1758364.out
    - slurm/logs/probing_merge_1758365.out
    - results/20260723_02061011/run_config.txt
    - results/20260723_02061011/results_summary.txt

notes: |
  FINAL RUN — every number in report/report.tex comes from this directory.
  run_config.txt records git_commit 0edd662 and submitted_at 2026-07-23
  02:06:10, matching the directory name. Adds the paired k-fold transfer-gap
  test (45 gap estimates per model x feature: 5 folds x 3 repeats x 3
