notes: |
  The change that turned the project around. Produced 300 cache entries (100
  utterances x 3 languages) holding 32,282 phoneme spans, 0 out-of-bounds
  and 0 empty span lists. Keyed by (lang, id, round(audio_length,2)) because
  FLEURS reuses sentence ids across speakers. Re-extracting with a different
  --max-samples invalidates this cache silently.
